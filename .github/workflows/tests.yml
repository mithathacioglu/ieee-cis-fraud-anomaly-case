name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Yerelde doğruladığım sürümlerin aynısı kurulsun. .[dev] geniş aralıklardan
      # kurar ve CI ile yerel ortam ayrışır; lock dosyası varken bunu kullanmamak
      # tekrarlanabilirliği kâğıt üstünde bırakır. Paket yapımının çektiği
      # setuptools pinli değil, kodun bağımlılık kapanışı pinli.
      - name: install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: install project without resolving dependencies again
        run: python -m pip install -e . --no-deps
      - name: lint
        run: python -m ruff check .
      - name: tests
        run: python -m pytest -q
