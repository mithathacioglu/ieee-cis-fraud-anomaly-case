[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-case"
version = "0.1.0"
description = "IEEE-CIS fraud and anomaly analysis case study"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4", "pyarrow>=18", "matplotlib>=3.9,<4", "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "dependency-injector>=4.45,<5"]

[project.optional-dependencies]
data = ["kaggle==2.2.4"]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[project.scripts]
fraud-profile = "fraud_case.profile:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ de import edilebilir olmali: baseline yardimcilarinin testi var
pythonpath = ["src", "scripts"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sirasi, B yaygin tuzaklar
select = ["E", "W", "F", "I", "B"]
# Rapor metinleri uzun Turkce cumleler; satir uzunlugunu formatter'a birakiyorum
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["fraud_case"]
